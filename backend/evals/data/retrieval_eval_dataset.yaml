- id: session_notice_deadline
  scenario: session_only
  query: "За сколько дней нужно направить уведомление?"
  answerable: true
  reference_answer: "Уведомление направляется не позднее чем за 10 календарных дней."
  expected_chunk_ids:
    - session_contract_notice
  expected_source_origins:
    - session
  chunks:
    - chunk_id: session_contract_notice
      document_id: contract_v2
      source_origin: session
      text: "Сторона обязана направить уведомление не позднее чем за 10 календарных дней до даты поставки."
    - chunk_id: session_contract_penalty
      document_id: contract_v2
      source_origin: session
      text: "За просрочку поставки применяется штраф в размере 3 процентов от стоимости партии."
    - chunk_id: session_contract_payment
      document_id: contract_v2
      source_origin: session
      text: "Оплата производится в течение 15 банковских дней после подписания акта."

- id: kb_equipment_warranty
  scenario: knowledge_base_only
  query: "Какой гарантийный срок указан для оборудования?"
  answerable: true
  reference_answer: "Гарантийный срок оборудования составляет 24 месяца."
  expected_chunk_ids:
    - kb_warranty_term
  expected_source_origins:
    - knowledge_base
  chunks:
    - chunk_id: kb_warranty_term
      document_id: kb_equipment_policy
      source_origin: knowledge_base
      text: "Гарантийный срок оборудования составляет 24 месяца с даты ввода в эксплуатацию."
    - chunk_id: kb_warranty_service
      document_id: kb_equipment_policy
      source_origin: knowledge_base
      text: "Сервисное обслуживание осуществляется на площадке заказчика."
