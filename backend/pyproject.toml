[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-navigator-pro"
version = "3.0.0"
description = "Microservice-based agentic system for analyzing legal documents and cost estimates"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "chainlit",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "services*"]
