services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm-tools-platform-agent-api
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    environment:
      - UMS_URL=${AGENT_API_UMS_URL:-http://ums:8090}
      - DOC_SERVER_URL=${AGENT_API_DOC_SERVER_URL:-http://document-server:8001}
      - LEGAL_SERVER_URL=${AGENT_API_LEGAL_SERVER_URL:-http://legal-server:8002}
      - MCP_DOCUMENT_SERVER_URL=${AGENT_API_MCP_DOCUMENT_SERVER_URL:-http://document-server:8001}
      - MCP_LEGAL_SERVER_URL=${AGENT_API_MCP_LEGAL_SERVER_URL:-http://legal-server:8002}
      - HOST_UPLOADS_DIR=/app/backend/open_webui_uploads
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend/open_webui_uploads:/app/backend/open_webui_uploads
      - ./backend/models:/app/backend/models
    working_dir: /app/backend
    command:
      - python
      - -m
      - uvicorn
      - orchestrator.agent_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - anp-backend
    depends_on:
      qdrant:
        condition: service_healthy
      document-server:
        condition: service_healthy
      legal-server:
        condition: service_healthy
      ums:
        condition: service_healthy

  document-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm-tools-platform-document-server
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    environment:
      - UMS_URL=${DOCUMENT_SERVER_UMS_URL:-http://ums:8090}
    volumes:
      - ./backend/open_webui_uploads:/app/backend/open_webui_uploads
      - ./backend/models:/app/backend/models
    working_dir: /app/backend
    command:
      - python
      - -m
      - uvicorn
      - services.document_server.mcp_document_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - anp-backend

  legal-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm-tools-platform-legal-server
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    environment:
      - UMS_URL=${LEGAL_SERVER_UMS_URL:-http://ums:8090}
    volumes:
      - ./backend/open_webui_uploads:/app/backend/open_webui_uploads
      - ./backend/models:/app/backend/models
    working_dir: /app/backend
    command:
      - python
      - -m
      - uvicorn
      - services.legal_server.mcp_legal_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - anp-backend

  ums:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm-tools-platform-ums
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    volumes:
      - ./backend/models:/app/backend/models
      - ./backend/open_webui_uploads:/app/backend/open_webui_uploads
    working_dir: /app/backend
    command:
      - python
      - services/model_manager/unified_model_server.py
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - anp-backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-tools-platform-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - grep -qiE ':18BD .* 0A ' /proc/net/tcp* /proc/net/tcp6*
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - anp-backend

  # --- Open WebUI ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.8.12
    container_name: open-webui
    entrypoint:
      - /bin/bash
      - /llm-tools-platform-patch/entrypoint.sh
    ports:
      - "3001:8080"
    env_file:
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
      - ./backend/open_webui_uploads:/app/backend/data/uploads
      - ./deploy/openwebui_legacy_patch:/llm-tools-platform-patch:ro
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=sk-dummy
      - ENABLE_FOLLOW_UP_GENERATION=False
      - HF_HUB_OFFLINE=1
      - ENABLE_RAG_WEB_SEARCH=False
      - ENABLE_RAG_LOCAL_WEB_FETCH=False
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - ENABLE_QDRANT_MULTITENANCY_MODE=true
      - QDRANT_COLLECTION_PREFIX=anp-openwebui
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://host.docker.internal:8090/v1
      - RAG_OPENAI_API_KEY=sk-dummy
      - RAG_EMBEDDING_MODEL=labse-embedding
      - RAG_RERANKING_ENGINE=
      - OPENWEBUI_SESSION_RAG_HANDOFF=preferred
    restart: always
    networks:
      - anp-backend
    depends_on:
      qdrant:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      ums:
        condition: service_healthy

  # --- Chainlit UI ---
  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    container_name: chainlit-ui
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    volumes:
      - ./backend/open_webui_uploads:/app/uploads
      - chainlit-data:/app/orchestrator/.data
    environment:
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET:-llm-tools-platform-secret-key-change-me}
      - CHAINLIT_ADMIN_USER=${CHAINLIT_ADMIN_USER:-admin}
      - CHAINLIT_ADMIN_PASSWORD=${CHAINLIT_ADMIN_PASSWORD:-admin}
      - CHAINLIT_DB_URL=${CHAINLIT_DB_URL:-sqlite+aiosqlite:///app/orchestrator/.data/chainlit.db}
      - UMS_URL=${CHAINLIT_UMS_URL:-http://host.docker.internal:8090}
      - DOC_SERVER_URL=${CHAINLIT_DOC_SERVER_URL:-http://host.docker.internal:8001}
      - LEGAL_SERVER_URL=${CHAINLIT_LEGAL_SERVER_URL:-http://host.docker.internal:8002}
      - MCP_DOCUMENT_SERVER_URL=${CHAINLIT_MCP_DOCUMENT_SERVER_URL:-http://host.docker.internal:8001}
      - MCP_LEGAL_SERVER_URL=${CHAINLIT_MCP_LEGAL_SERVER_URL:-http://host.docker.internal:8002}
      - UPLOADS_DIR=/app/uploads
      - HOST_UPLOADS_DIR=${PWD}/backend/open_webui_uploads
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
        required: false
      document-server:
        condition: service_healthy
        required: false
      legal-server:
        condition: service_healthy
        required: false
      ums:
        condition: service_healthy
        required: false
    profiles:
      - compat

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: llm-tools-platform-vllm
    profiles:
      - vllm
    ports:
      - "${VLLM_PORT:-8101}:8000"
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/.env.runtime
        required: false
    environment:
      - VLLM_INTERNAL_PORT=8000
      - HF_HOME=/root/.cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ./backend/models:/models
      - ./scripts/run_vllm_service.sh:/opt/llm-tools-platform/run_vllm_service.sh:ro
      - vllm-cache:/root/.cache/huggingface
    entrypoint:
      - /bin/bash
      - /opt/llm-tools-platform/run_vllm_service.sh
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    gpus: all
    ipc: host
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: llm-tools-platform-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: llm-tools-platform-grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-me-grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  open-webui: {}
  chainlit-data: {}
  vllm-cache: {}
  qdrant-data: {}

networks:
  anp-backend:
    name: llm-tools-platform-backend
