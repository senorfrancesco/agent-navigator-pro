services:
  # --- Open WebUI (legacy, можно отключить после перехода на Chainlit) ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3001:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
      - ./backend/open_webui_uploads:/app/backend/data/uploads
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=sk-dummy
      - HF_HUB_OFFLINE=1
      - ENABLE_RAG_WEB_SEARCH=False
      - ENABLE_RAG_LOCAL_WEB_FETCH=False
      - WEBUI_NAME=Agent Navigator
      # Отключаем встроенный RAG, так как он требует загрузки моделей из интернета
      - RAG_EMBEDDING_ENGINE=
      - RAG_RERANKING_ENGINE=
    restart: always
    profiles:
      - legacy

  # --- Chainlit UI (основной фронтенд v3.0) ---
  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    container_name: chainlit-ui
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/open_webui_uploads:/app/uploads
      - chainlit-data:/app/orchestrator/.data
    environment:
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET:-agent-navigator-secret-key-change-me}
      - CHAINLIT_ADMIN_USER=${CHAINLIT_ADMIN_USER:-admin}
      - CHAINLIT_ADMIN_PASSWORD=${CHAINLIT_ADMIN_PASSWORD:-admin}
      - CHAINLIT_DB_URL=${CHAINLIT_DB_URL:-sqlite+aiosqlite:///app/orchestrator/.data/chainlit.db}
      - UMS_URL=http://host.docker.internal:8090
      - DOC_SERVER_URL=http://host.docker.internal:8001
      - LEGAL_SERVER_URL=http://host.docker.internal:8002
      - MCP_DOCUMENT_SERVER_URL=http://host.docker.internal:8001
      - MCP_LEGAL_SERVER_URL=http://host.docker.internal:8002
      - UPLOADS_DIR=/app/uploads
      - HOST_UPLOADS_DIR=${PWD}/backend/open_webui_uploads
    restart: unless-stopped
    depends_on: []

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: agent-nav-vllm
    profiles:
      - vllm
    ports:
      - "${VLLM_PORT:-8101}:8000"
    env_file:
      - ./backend/.env
    environment:
      - VLLM_INTERNAL_PORT=8000
      - HF_HOME=/root/.cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ./backend/models:/models
      - ./scripts/run_vllm_service.sh:/opt/agent-navigator/run_vllm_service.sh:ro
      - vllm-cache:/root/.cache/huggingface
    entrypoint:
      - /bin/bash
      - /opt/agent-navigator/run_vllm_service.sh
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    gpus: all
    ipc: host
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: agent-nav-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: agent-nav-grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-me-grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  open-webui: {}
  chainlit-data: {}
  vllm-cache: {}
