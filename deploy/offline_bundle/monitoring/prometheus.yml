global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agent-api
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-api:8000"]

  - job_name: ums
    metrics_path: /metrics
    static_configs:
      - targets: ["ums:8090"]

  - job_name: document-server-health
    metrics_path: /health
    static_configs:
      - targets: ["document-server:8001"]

  - job_name: legal-server-health
    metrics_path: /health
    static_configs:
      - targets: ["legal-server:8002"]

  - job_name: chainlit-ui
    metrics_path: /
    static_configs:
      - targets: ["chainlit:3000"]
